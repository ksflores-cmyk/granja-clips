name: publicar-ensayo

# Ensayo del publicador: nunca publica. Con claves, habla con Buffer y Supabase (sólo lecturas, un
# archivo de prueba de 1 s que sube y borra, y la confirmación de canales). Sin claves, lo simula y sale en verde.
on:
  workflow_dispatch:
    inputs:
      borrador:
        description: "Además, crear un borrador en cada canal y borrarlo enseguida (nunca publica)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ensayo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt
      - name: Ensayo del publicador
        run: python -m fabrica.publicar --ensayo
      - name: Borrador y borrado en cada canal (sólo si se pidió)
        if: ${{ inputs.borrador }}
        run: python -m fabrica.publicar --borrador
