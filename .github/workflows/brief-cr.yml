name: brief-cr

# Lee con la sesión de Kevin (secreto CR_SESION) el brief completo de campañas de Content Rewards a las que
# ya está unido: texto, captura, enlaces de material y texto de los Google Docs públicos. No envía nada ni se
# une a campañas. El resultado va al artefacto «briefs-cr» (privado, 3 días) para completar fuentes.yml.
on:
  workflow_dispatch:
    inputs:
      campanas:
        description: "cr_campaign_id separados por espacios"
        required: true
        default: "1391fb95-e8a3-4f0b-b146-d0d786e6aee0 a1cefc3b-4533-438f-8e70-a7299550f1cf 03bda4fd-3474-4b1e-a914-88aaf3ac8372"

permissions:
  contents: read

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      CR_SESION: ${{ secrets.CR_SESION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright==1.65.2 && python -m playwright install --with-deps chromium
      - name: Leer briefs
        env:
          CAMPANAS: ${{ inputs.campanas }}
        run: |
          args=""; for c in $CAMPANAS; do args="$args --campana $c"; done
          python -m fabrica.brief_cr $args --salida "$RUNNER_TEMP/briefs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefs-cr
          path: ${{ runner.temp }}/briefs
          retention-days: 3
          if-no-files-found: ignore
