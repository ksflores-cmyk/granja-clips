name: fabrica

# El ciclo de la fábrica. El disparador principal es externo (cron-job.org, cada hora en punto, workflow_dispatch):
# el cron de GitHub casi no llega (3 de 24 el 21 nov), así que `schedule` queda SÓLO como respaldo de los huecos.
# Cálculo del respaldo: config/horarios.yml tiene huecos GT 09, 11, 13, 16, 19 y 22, y cada corrida programa el hueco
# que cae de ahora+15 a ahora+75 min. Una corrida a las H:23 GT ve la ventana H:38 a (H+1):38, o sea el hueco de las
# (H+1):00. Respaldo = las :23 de la hora anterior a cada hueco: 08, 10, 12, 15, 18 y 21 GT. GT = UTC-6, así que
# en UTC: 14, 16, 18, 21, 00 y 03. (pruebas/test_ahorro_actions.py lo comprueba contra horarios.yml.)
# La cadencia y el hueco los decide el código (fabrica.ciclo), no el cron.
# UN solo job (no se pagan dos redondeos de minuto): el primer paso lee PAUSA y, si hay, termina en verde sin
# instalar nada; si no, `decidir` dice trabajo=si|no y sólo con `si` corren los pasos de producir.
on:
  schedule:
    - cron: "23 14,16,18,21,0,3 * * *"
  workflow_dispatch:
    inputs:
      ensayo_forzado:
        description: "Corre el ciclo completo en ensayo aunque exista PAUSA (sólo si config/modo.yml dice ensayo)"
        type: boolean
        default: false

concurrency:
  group: fabrica
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fabrica:
    runs-on: ubuntu-latest
    timeout-minutes: 23          # 3 de decidir + 20 de producir; cada paso largo conserva su tope propio
    env:
      REPO_PRIVADO: ${{ github.event.repository.private }}
      PYTHONUNBUFFERED: "1"      # sin búfer: si GitHub cancela la corrida, el log ya escrito se conserva
      ENSAYO_FORZADO: ${{ inputs.ensayo_forzado }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      cr: ${{ steps.compuerta.outputs.cr }}
    steps:
      - uses: actions/checkout@v4
      # Cada corrida parte del estado MÁS NUEVO de main, no del SHA que la disparó: si quedó en cola detrás de
      # otra que guardó un envío, el marcador, el libro de envíos y PAUSA de su checkout estarían viejos.
      - name: Partir de main al día
        if: ${{ github.ref == 'refs/heads/main' }}
        run: git fetch origin main && git reset --hard origin/main
      # Paso 1, sólo bash: PAUSA (sin ensayo forzado = termina aquí) y si hay campaña de Content Rewards.
      # `cr` se calcula siempre (también con PAUSA): el robot de envío no depende de la pausa. Con el python3 del
      # runner; si no puede leer fuentes.yml, `cr=si` (el robot decide por sí solo y termina en 1 minuto).
      - name: Compuerta (PAUSA y campañas CR)
        id: compuerta
        run: |
          if [ -f PAUSA ] && [ "$ENSAYO_FORZADO" != "true" ]; then
            echo "activo=no" >> "$GITHUB_OUTPUT"
            echo "PAUSA: $(grep -m1 '^motivo:' PAUSA || echo 'sin motivo'). No se instala nada."
          else
            echo "activo=si" >> "$GITHUB_OUTPUT"
          fi
          cr=$(python3 -m fabrica.fuentes 2>/dev/null | grep -m1 '^cr=') || cr="cr=si"
          echo "$cr" >> "$GITHUB_OUTPUT"
          echo "$cr"
      - uses: actions/setup-python@v5
        if: ${{ steps.compuerta.outputs.activo == 'si' }}
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: ${{ steps.compuerta.outputs.activo == 'si' }}
      - name: Decidir (validar, cadencia, tope y hueco)
        id: decidir
        if: ${{ steps.compuerta.outputs.activo == 'si' && !inputs.ensayo_forzado }}
        run: python -m fabrica.ciclo --decidir
      - name: Marcar el inicio (reloj)
        if: ${{ steps.decidir.outputs.trabajo == 'si' || inputs.ensayo_forzado }}
        run: echo "INICIO_S=$(date +%s)" >> "$GITHUB_ENV"
      - name: Instalar ffmpeg
        if: ${{ steps.decidir.outputs.trabajo == 'si' || inputs.ensayo_forzado }}
        timeout-minutes: 12
        uses: ./.github/actions/ffmpeg
      - name: Instalar faster-whisper (voces, tarea #19)
        if: ${{ steps.decidir.outputs.trabajo == 'si' || inputs.ensayo_forzado }}
        timeout-minutes: 4
        continue-on-error: true   # las voces son opcionales: sin la biblioteca la toma sigue como antes
        run: |
          pip install -r requirements-voces.txt || echo "::warning::sin faster-whisper: el ciclo sigue sin voces"
      - name: Caché del modelo de transcripción
        if: ${{ steps.decidir.outputs.trabajo == 'si' || inputs.ensayo_forzado }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-fabrica-small-v1
          restore-keys: whisper-fabrica-
      - name: Marcar el inicio (en el repo, por si la corrida muere)
        if: ${{ steps.decidir.outputs.trabajo == 'si' || inputs.ensayo_forzado }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$ENSAYO_FORZADO" != "true" ]; then
            python -m fabrica.ciclo --marcar-inicio --run-id "$GITHUB_RUN_ID" || true
            if [ -n "$(git status --porcelain -- estado/actions-minutos.json)" ]; then
              git config user.name "fabrica"
              git config user.email "fabrica@users.noreply.github.com"
              git add -A -- estado/actions-minutos.json
              git commit -q -m "[skip ci] inicio de ciclo $GITHUB_RUN_ID"
              for intento in 1 2 3; do
                git push origin "HEAD:${GITHUB_REF_NAME}" && break
                git pull -q --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort; break; }
              done
            fi
          fi
      - name: Bajar música del release
        if: ${{ steps.decidir.outputs.trabajo == 'si' || inputs.ensayo_forzado }}
        timeout-minutes: 3       # sin música la pieza muda sale en rojo sin gastar la fuente; no debe comerse el ciclo
        continue-on-error: true  # si se cancela por tiempo o falla, el job sigue y corre el Ciclo igual
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download musica -D "$RUNNER_TEMP/musica" --clobber || echo "::warning::sin música del release"
      - name: Bajar efectos de sonido del release
        if: ${{ steps.decidir.outputs.trabajo == 'si' || inputs.ensayo_forzado }}
        timeout-minutes: 3       # sin efectos la historia no usa sfx (zoom y cámara lenta siguen); no debe comerse el ciclo
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sfx -D "$RUNNER_TEMP/sfx" --clobber || echo "::warning::sin efectos del release"
      - name: Ciclo
        if: ${{ steps.decidir.outputs.trabajo == 'si' || inputs.ensayo_forzado }}
        timeout-minutes: 15      # el ciclo se corta solo a los 13 (plazo) y 14 min (alarma); el job tiene 20 para cerrar
        env:
          GRANJA_MUSICA_DIR: ${{ runner.temp }}/musica
          GRANJA_SFX_DIR: ${{ runner.temp }}/sfx
        run: |
          # Fuera de main (un dispatch desde otra rama) sólo se hace ensayo y no se guarda nada.
          extra=""
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then extra="--modo-ensayo"; fi
          # Tercera capa: `timeout -k` mata el proceso (y a sus hijos al soltar la sesión) 870 s después del
          # INICIO_S del job, aunque Python siga bloqueado. Mínimo 30 s.
          resto=$(( 870 - ( $(date +%s) - INICIO_S ) ))
          if [ "$resto" -lt 30 ]; then resto=30; fi
          if [ "$ENSAYO_FORZADO" = "true" ]; then
            timeout -k 10 "${resto}s" python -m fabrica.ciclo $extra --ensayo-forzado --salida "$RUNNER_TEMP/ensayo"
          else
            timeout -k 10 "${resto}s" python -m fabrica.ciclo $extra
          fi
      - name: Subir el ensayo (MP4, plan e informe de la puerta)
        if: ${{ always() && inputs.ensayo_forzado }}
        uses: actions/upload-artifact@v4
        with:
          name: ensayo-forzado
          path: ${{ runner.temp }}/ensayo
          retention-days: 1
          if-no-files-found: error
      # El cron corre en `main` y la fábrica guarda su estado con un push directo (decisión del director):
      # es el repo de la fábrica. Por eso el commit sólo puede incluir los archivos de PERMITIDOS; cualquier
      # otro archivo cambiado hace fallar el paso ANTES de commit y push. El issue de alerta roja se abre
      # sólo después de que el push haya quedado confirmado; si el push falla 3 veces, el paso falla sin
      # abrir el issue (la corrida en rojo ya avisa por correo de GitHub).
      - name: Cerrar el ciclo (minutos, avisos, alerta roja, commit)
        if: ${{ always() && steps.decidir.outputs.trabajo == 'si' && !inputs.ensayo_forzado && github.ref == 'refs/heads/main' }}
        run: |
          set -u
          PERMITIDOS='^(marcador\.csv|registro\.md|estado/.*|config/canales\.yml|informativas\.yml|marca\.yml|retiros\.md|config/vetados\.yml|PAUSA)$'
          minutos=$(( ( $(date +%s) - INICIO_S + 59 ) / 60 ))
          python -m fabrica.ciclo --sumar-minutos "$minutos" --run-id "$GITHUB_RUN_ID"
          # Una vez al día (el primer ciclo con trabajo): minutos de ayer por workflow; si el mes pasa de 2400, PAUSA.
          python -m fabrica.ciclo --contar-minutos || true
          python -m fabrica.ciclo --abrir-avisos || true
          python -m fabrica.retiros --abrir-avisos || true
          alerta=no
          if [ -f estado/alerta.json ] && [ -n "$(git status --porcelain -- estado/alerta.json)" ]; then
            alerta=si
            motivo=$(python -c "import json;print(json.load(open('estado/alerta.json',encoding='utf-8'))['motivo'])")
            git add -f PAUSA estado/alerta.json
            [ -f estado/alerta-roja.json ] && git add -f estado/alerta-roja.json
          fi
          fuera=$(git status --porcelain --untracked-files=all | cut -c4- | grep -Ev "$PERMITIDOS" || true)
          if [ -n "$fuera" ]; then
            echo "Archivos fuera de la lista permitida; no se hace commit ni push:"
            echo "$fuera"
            exit 1
          fi
          for ruta in marcador.csv registro.md estado config/canales.yml informativas.yml marca.yml retiros.md config/vetados.yml; do
            [ -e "$ruta" ] && git add -A -- "$ruta"
          done
          if git diff --cached --quiet; then
            echo "Nada que guardar."
            exit 0
          fi
          git config user.name "fabrica"
          git config user.email "fabrica@users.noreply.github.com"
          git commit -m "[skip ci] ciclo $(TZ=America/Guatemala date '+%Y-%m-%d %H:%M')"
          guardado=no
          for intento in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              guardado=si
              break
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort
          done
          if [ "$guardado" != "si" ]; then
            echo "El push fue rechazado 3 veces."
            exit 1
          fi
          if [ "$alerta" = "si" ]; then
            gh label create alerta-roja --color B60205 --force || true
            gh issue create --title "ALERTA ROJA: ${motivo}" --label alerta-roja \
              --body "La fábrica creó PAUSA y no publica nada más. Motivo: ${motivo}. Detalle en estado/alerta.json (sin claves). Para reanudar, revisa y borra PAUSA."
          fi

  # Robot de envío a Content Rewards: el enlace vale sólo si se envía en los 30 min siguientes a publicar.
  # Corre DESPUÉS del job `fabrica` (always(): aunque falle) y sólo si fuentes.yml tiene una ficha vigente,
  # publicable y con cr_campaign_id (output `cr` de la compuerta): sin campaña no se paga ni un minuto.
  # Escribe su propio archivo (estado/envios-cr.json). Sin nada pendiente termina en menos de un minuto.
  enviar_cr:
    # En paralelo a `fabrica` (revisión de Codex, 22 nov): esperar a que termine (hasta 23 min) podía pasar el
    # plazo de 30 min de Content Rewards. Comprueba por su cuenta si hay campaña vigente y, si no, termina en 1 min.
    if: ${{ github.ref == 'refs/heads/main' && !inputs.ensayo_forzado }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PYTHONUNBUFFERED: "1"
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CR_SESION: ${{ secrets.CR_SESION }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Partir de main al día
        run: git fetch origin main && git reset --hard origin/main
      - name: ¿Hay campaña vigente con Content Rewards?
        id: cr
        run: |
          cr=$(python3 -m fabrica.fuentes 2>/dev/null | grep -m1 '^cr=') || cr="cr=si"
          echo "$cr" >> "$GITHUB_OUTPUT"; echo "$cr"
      - uses: actions/setup-python@v5
        if: ${{ steps.cr.outputs.cr == 'si' }}
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: ${{ steps.cr.outputs.cr == 'si' }}
      - name: ¿Hay envíos pendientes?
        id: hay
        if: ${{ steps.cr.outputs.cr == 'si' }}
        run: |
          if python -m fabrica.enviar_cr --hay; then echo "hay=si" >> "$GITHUB_OUTPUT"; else echo "hay=no" >> "$GITHUB_OUTPUT"; fi
      - name: Instalar el navegador (Playwright + Chromium)
        if: ${{ steps.hay.outputs.hay == 'si' }}
        timeout-minutes: 6
        run: pip install playwright==1.65.2 && python -m playwright install --with-deps chromium
      - name: Enviar enlaces a Content Rewards
        if: ${{ steps.hay.outputs.hay == 'si' }}
        timeout-minutes: 18
        # Sin capturas (25 nov): el repo es público y una captura con la sesión de Kevin no puede ir a un artefacto.
        run: python -m fabrica.enviar_cr
      - name: Guardar resultado (y alerta si la sesión venció)
        if: ${{ always() && steps.hay.outputs.hay == 'si' }}
        run: |
          set -u
          alerta=no
          if [ -f estado/alerta-cr.json ] && [ -n "$(git status --porcelain -- estado/alerta-cr.json)" ]; then alerta=si; fi
          git add -A -- estado/envios-cr.json estado/alerta-cr.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nada que guardar."; exit 0; fi
          git config user.name "fabrica"
          git config user.email "fabrica@users.noreply.github.com"
          git commit -q -m "[skip ci] envíos a Content Rewards $(TZ=America/Guatemala date '+%Y-%m-%d %H:%M')"
          for intento in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort
          done
          if [ "$alerta" = "si" ]; then
            motivo=$(python -c "import json;print(json.load(open('estado/alerta-cr.json',encoding='utf-8'))['motivo'])")
            gh label create alerta-roja --color B60205 --force || true
            gh issue create --title "ALERTA ROJA: ${motivo}" --label alerta-roja \
              --body "El robot no pudo entrar a Content Rewards, así que los clips de campaña no se están enviando. Hay que renovar el secreto CR_SESION (herramientas/LEEME-sesion-cr.md). Los clips sin campaña siguen publicándose."
          fi
