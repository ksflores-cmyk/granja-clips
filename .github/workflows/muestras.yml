name: muestras

# Renderiza las 3 muestras de estilo en la nube y las deja como artefacto (3 días).
# No escribe en ninguna rama: el video nunca entra al repo ni a la PC de Kevin.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "marca/**"
      - "fabrica/**"
      - "marca.yml"
      - "fuentes.yml"
      - "requirements.txt"
      - ".github/workflows/muestras.yml"
  pull_request:
    paths:
      - "marca/**"
      - "fabrica/**"
      - "marca.yml"
      - "fuentes.yml"
      - "requirements.txt"
      - ".github/workflows/muestras.yml"

permissions:
  contents: read

concurrency:
  group: muestras-${{ github.ref }}
  cancel-in-progress: true

jobs:
  muestras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        timeout-minutes: 12
        uses: ./.github/actions/ffmpeg
      - run: pip install -r requirements.txt
      - name: Bajar música del release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download musica -D "$RUNNER_TEMP/musica" --clobber || echo "::warning::sin música del release"
      - name: Renderizar muestras fuera del repo
        env:
          GRANJA_MUSICA_DIR: ${{ runner.temp }}/musica
        run: python -m fabrica.editar.muestras --salida "$RUNNER_TEMP/muestras"
      - name: Resumen de la puerta de estilo
        if: always()
        run: tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/muestras/puerta-estilo-auto.md" || true
      - name: Subir muestras como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muestras
          path: ${{ runner.temp }}/muestras
          retention-days: 3
          if-no-files-found: error
