name: muestras

# Renderiza las muestras de estilo (3 + 1 de música + 2 de historia, #20) en la nube y las deja como artefacto (3 días).
# No escribe en ninguna rama: el video nunca entra al repo ni a la PC de Kevin.
on:
  workflow_dispatch:
  push:
    branches: ["main"]   # ahorro de minutos (20 nov): las ramas ya corren en su PR
    paths:
      - "marca/**"
      - "fabrica/**"
      - "marca.yml"
      - "config/voces.yml"
      - "fuentes.yml"
      - "config/historia.yml"
      - "requirements.txt"
      - "requirements-voces.txt"
      - ".github/workflows/muestras.yml"
  pull_request:
    paths:
      - "marca/**"
      - "fabrica/**"
      - "marca.yml"
      - "config/voces.yml"
      - "fuentes.yml"
      - "config/historia.yml"
      - "requirements.txt"
      - "requirements-voces.txt"
      - ".github/workflows/muestras.yml"

permissions:
  contents: read

concurrency:
  group: muestras-${{ github.ref }}
  cancel-in-progress: true

jobs:
  muestras:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        timeout-minutes: 12
        uses: ./.github/actions/ffmpeg
      - run: pip install -r requirements.txt
      - name: Instalar faster-whisper (voces, tarea #19)
        run: pip install -r requirements-voces.txt
      - name: Caché de modelos de transcripción (base y small)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-muestras-base-small-v1
          restore-keys: whisper-muestras-
      - name: Bajar música del release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download musica -D "$RUNNER_TEMP/musica" --clobber || echo "::warning::sin música del release"
      - name: Bajar efectos de sonido del release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sfx -D "$RUNNER_TEMP/sfx" --clobber || echo "::warning::sin efectos del release"
      - name: Renderizar muestras fuera del repo
        env:
          GRANJA_MUSICA_DIR: ${{ runner.temp }}/musica
          GRANJA_SFX_DIR: ${{ runner.temp }}/sfx
        run: python -m fabrica.editar.muestras --salida "$RUNNER_TEMP/muestras"
      # Sin medición de voces sobre material de campaña (revisión de Codex, 22 nov): el resumen del paso es
      # público en este repo y llevaría la transcripción de un video de la marca (FM27, pausada).
      - name: Resumen de voces (muestra sintética)
        if: always()
        run: |
          python -m fabrica.voces --resumen "$RUNNER_TEMP/muestras/voces.json" \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Resumen de la puerta de estilo
        if: always()
        run: tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/muestras/puerta-estilo-auto.md" || true
      - name: Subir muestras como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muestras
          path: ${{ runner.temp }}/muestras
          retention-days: 3
          if-no-files-found: error
