name: diagnostico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - name: Qué secretos hay (sin imprimir valores)
        shell: bash
        run: |
          for n in GEMINI_API_KEY BUFFER_API_KEY SUPABASE_URL SUPABASE_SERVICE_KEY TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET; do
            if [ -n "${!n}" ]; then echo "$n: presente"; else echo "$n: ausente"; fi
          done
      - name: Twitch, token e id del juego (sólo imprime el id)
        shell: bash
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ] || [ -z "$TWITCH_CLIENT_SECRET" ]; then
            echo "Twitch: faltan claves, se omite"; exit 0
          fi
          # El secreto viaja por la entrada estándar, no en la línea de órdenes.
          codigo=$(printf 'client_id=%s&client_secret=%s&grant_type=client_credentials' \
              "$TWITCH_CLIENT_ID" "$TWITCH_CLIENT_SECRET" \
            | curl -sS -o token.json -w '%{http_code}' -X POST https://id.twitch.tv/oauth2/token --data @-)
          if [ "$codigo" != "200" ]; then
            echo "Twitch: error HTTP $codigo en el token"; rm -f token.json; exit 1
          fi
          token=$(python3 -c 'import json; print(json.load(open("token.json")).get("access_token",""))')
          rm -f token.json
          if [ -z "$token" ]; then echo "Twitch: la respuesta del token no trae access_token"; exit 1; fi
          echo "::add-mask::$token"
          codigo=$(curl -sS -G -o juego.json -w '%{http_code}' https://api.twitch.tv/helix/games \
            --data-urlencode "name=Grand Theft Auto VI" \
            -H "Client-Id: $TWITCH_CLIENT_ID" -H "Authorization: Bearer $token")
          if [ "$codigo" != "200" ]; then
            echo "Twitch: error HTTP $codigo en games"; rm -f juego.json; exit 1
          fi
          python3 -c 'import json; d=json.load(open("juego.json")).get("data",[]); print("id de Grand Theft Auto VI:", d[0]["id"] if d else "no encontrado")'
          rm -f juego.json
