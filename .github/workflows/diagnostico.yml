name: diagnostico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - name: Qué secretos hay (sin imprimir valores)
        shell: bash
        run: |
          for n in GEMINI_API_KEY BUFFER_API_KEY SUPABASE_URL SUPABASE_SERVICE_KEY TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET; do
            if [ -n "${!n}" ]; then echo "$n: presente"; else echo "$n: ausente"; fi
          done
      - name: Twitch, token e id del juego (sólo imprime el id)
        shell: bash
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ] || [ -z "$TWITCH_CLIENT_SECRET" ]; then
            echo "Twitch: faltan claves, se omite"; exit 0
          fi
          # Nada se escribe en disco: las respuestas viajan en variables y por tuberías.
          # El secreto viaja por la entrada estándar, no en la línea de órdenes.
          salida=$(printf 'client_id=%s&client_secret=%s&grant_type=client_credentials' \
              "$TWITCH_CLIENT_ID" "$TWITCH_CLIENT_SECRET" \
            | curl -sS -w '\n%{http_code}' -X POST https://id.twitch.tv/oauth2/token --data @-)
          codigo=${salida##*$'\n'}
          if [ "$codigo" != "200" ]; then
            echo "Twitch: error HTTP $codigo en el token"; exit 1
          fi
          token=$(printf '%s' "${salida%$'\n'*}" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$token" ]; then echo "Twitch: la respuesta del token no trae access_token"; exit 1; fi
          echo "::add-mask::$token"
          salida=$(curl -sS -G -w '\n%{http_code}' https://api.twitch.tv/helix/games \
            --data-urlencode "name=Grand Theft Auto VI" \
            -H "Client-Id: $TWITCH_CLIENT_ID" -H "Authorization: Bearer $token")
          codigo=${salida##*$'\n'}
          if [ "$codigo" != "200" ]; then
            echo "Twitch: error HTTP $codigo en games"; exit 1
          fi
          printf '%s' "${salida%$'\n'*}" | python3 -c 'import sys,json; d=json.load(sys.stdin).get("data",[]); print("id de Grand Theft Auto VI:", d[0]["id"] if d else "no encontrado")'
      - name: Gemini, ping de texto por modelo (no imprime la clave)
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "Gemini: falta la clave"; exit 0; fi
          for m in gemini-3.8-flash gemini-3.8-flash-lite gemini-3.7-flash gemini-3.7-flash-lite gemini-3-flash-preview gemini-2.5-flash gemini-2.5-flash-lite; do
            ini=$(date +%s)
            cod=$(printf '{"contents":[{"parts":[{"text":"Responde solo: ok"}]}]}' | curl -sS -o /tmp/g.json -w '%{http_code}' --max-time 40 \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' --data @- \
              "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" || echo "000")
            echo "Gemini $m: HTTP $cod en $(( $(date +%s) - ini )) s"
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        shell: bash
        run: pip install PyYAML==6.0.3 tzdata==2025.2
      - name: Buscador T, diagnóstico (no escribe en el repo, no imprime claves)
        continue-on-error: false
        shell: bash
        run: python -m fabrica.detectar --diagnostico-t --n 10
