name: diagnostico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - name: Qué secretos hay (sin imprimir valores)
        run: |
          for n in GEMINI_API_KEY BUFFER_API_KEY SUPABASE_URL SUPABASE_SERVICE_KEY TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET; do
            if [ -n "${!n}" ]; then echo "$n: presente"; else echo "$n: ausente"; fi
          done
      - name: Twitch, token e id del juego (sólo imprime el id)
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ] || [ -z "$TWITCH_CLIENT_SECRET" ]; then
            echo "Twitch: faltan claves, se omite"; exit 0
          fi
          token=$(curl -sS -X POST https://id.twitch.tv/oauth2/token \
            -d "client_id=$TWITCH_CLIENT_ID" -d "client_secret=$TWITCH_CLIENT_SECRET" \
            -d "grant_type=client_credentials" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$token" ]; then echo "Twitch: no se obtuvo token"; exit 0; fi
          echo "::add-mask::$token"
          curl -sS -G https://api.twitch.tv/helix/games \
            --data-urlencode "name=Grand Theft Auto VI" \
            -H "Client-Id: $TWITCH_CLIENT_ID" -H "Authorization: Bearer $token" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin).get("data",[]); print("id de Grand Theft Auto VI:", d[0]["id"] if d else "no encontrado")'
