name: release-fm27

# Copia UNA vez los 5 videos oficiales de SEGA FM27 de Google Drive al release privado `fuentes-fm27`
# de este repo (Drive corta con "Quota exceeded"). La fábrica baja de ahí con GITHUB_TOKEN.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */4 * * *"     # reintenta cada 4 h mientras falte alguno; completo, se desactiva solo
  push:
    branches: [claude/clips-release-fm27]
    paths: [".github/workflows/release-fm27.yml", "fabrica/release.py"]

concurrency: {group: release-fm27, cancel-in-progress: false}

permissions: {contents: write, actions: write}

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Instalar ffmpeg
        timeout-minutes: 12
        uses: ./.github/actions/ffmpeg
      - name: Subir lo que falte
        id: subir
        timeout-minutes: 60
        run: python -m fabrica.release subir --ficha sega-fm27 --tag fuentes-fm27
      - name: Verificar con GITHUB_TOKEN
        if: steps.subir.outputs.completo == 'si'
        timeout-minutes: 15
        run: python -m fabrica.release verificar --ficha sega-fm27 --tag fuentes-fm27
      - name: Desactivar el reintento
        # Para volver a usarlo: gh workflow enable release-fm27
        if: steps.subir.outputs.completo == 'si' && github.event_name == 'schedule'
        run: gh workflow disable release-fm27 --repo "$GITHUB_REPOSITORY"
