name: puerta

on:
  # Ahorro de minutos (20 nov): antes corría dos veces por cada push a una rama con PR.
  push:
    branches: [main]
    paths-ignore: ["**.md", "estado/**", "marcador.csv", "envios-pendientes.csv", "PAUSA"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # los borradores no gastan minutos (job con `if` abajo)
    paths-ignore: ["**.md", "estado/**", "marcador.csv", "envios-pendientes.csv", "PAUSA"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puerta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  puerta:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        timeout-minutes: 12
        uses: ./.github/actions/ffmpeg
      - run: pip install -r requirements.txt
      - name: Validar configuración
        run: python -m fabrica.validar
      - name: Pruebas
        run: python -m pytest -q
