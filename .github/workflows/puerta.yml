name: puerta

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: puerta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  puerta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt
      - name: Validar configuración
        run: python -m fabrica.validar
      - name: Pruebas
        run: python -m pytest -q
