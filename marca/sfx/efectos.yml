# Efectos de sonido CC0 de Guion Vivo (tarea #20 «historia»). Sólo como efecto corto sobre clips sin
# `sin_musica` y fuera de campañas mientras `sfx_en_campanas: false`.
#
# El audio NO vive en el repo: lo sube el workflow `sfx.yml` al release privado `sfx` tras leer la página de
# origen y comprobar «License(s): CC0». Varios efectos salen del mismo zip (se baja una vez por URL).
# La fábrica sólo usa un efecto `verificada` con su LICENCIA.md y el sha256 del archivo bajado igual al de aquí.
#
# Campos: id (carpeta marca/sfx/<id>/), titulo, autor, pagina, archivo (zip guardado en "File(s):"),
# zip_miembro (audio de dentro), licencia (sólo CC0), tipo, asset, sha256 (null hasta la corrida verde),
# estado (candidata | verificada | descartada).
licencias_permitidas: [CC0]
release: sfx
duracion_min_s: 0.1
duracion_max_s: 4.0
minimo: 6
efectos:
