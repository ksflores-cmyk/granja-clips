    titulo: "Golpe de metal"
    autor: "Kenney"
    pagina: "https://opengameart.org/content/sci-fi-sounds"
    archivo: "sci-fi_sounds.zip"
    zip_miembro: "Audio/impactMetal_000.ogg"
