# Música de biblioteca de Guion Vivo (decisión de Kevin del 19 nov 2026, 8:00 p. m.).
# Sólo para piezas SIN audio propio (informativa tipográfica, o video mudo) y nunca en fichas con
# `reglas.sin_musica: true`. Los clips con video llevan su audio original.
#
# El audio NO vive en el repo (regla: ni video ni audio en git). Cada pista está en el release privado
# `musica` de este repo, con el nombre de `asset`. La sube el workflow `musica.yml`, que dentro de
# GitHub Actions lee la página de origen, comprueba que el campo de licencia diga CC0, baja el archivo
# y anota su sha256. La fábrica sólo usa una pista con `estado: verificada`, su LICENCIA.md al lado
# y el sha256 del archivo bajado igual al de aquí.
#
# Campos: id (carpeta marca/musica/<id>/), titulo, autor, pagina (enlace leído), archivo (nombre guardado en
# "File(s):" de la página), zip_miembro (si el archivo es un .zip, el audio que se usa de dentro),
# licencia (sólo CC0), estilo, inicio_s (dónde empieza el recorte), asset (nombre en el release),
# sha256 (del asset; null hasta la primera corrida verde de musica.yml), estado (candidata | verificada | descartada).
licencias_permitidas: [CC0]
release: musica
pistas:
  - id: calm-track
    titulo: "Calm Track"
    autor: "pmiller"
    pagina: "https://opengameart.org/content/calm-track"
    archivo: "calm_track.ogg"
    licencia: CC0
    estilo: "ambiental calmado, evoluciona despacio"
    inicio_s: 0
    asset: "calm-track.ogg"
    sha256: null
    estado: candidata
