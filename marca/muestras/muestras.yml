# Las 3 muestras de la puerta de estilo (plantilla v2: las tres con video, a pantalla completa).
# Frases y datos de la especificación N2; la informativa tipográfica ya no es muestra (su prueba sigue en pytest).
# Los tiempos de las líneas son segundos relativos al recorte. `original` sólo va al manifiesto.
muestras:
  - id: dialogo-sintel
    pilar: primeras_veces          # demostración del diálogo traducido
    fuente_id: sintel-cc-by
    video:
      url: https://raw.githubusercontent.com/mdn/shared-assets/main/videos/sintel-short.mp4
      sha256: 358447f332663e6f3794816e32b8072526fcba8bf8744dc7fb3387afb5b2fceb
    subtitulos:
      url: https://raw.githubusercontent.com/mdn/shared-assets/main/misc/sintel-en.vtt
      sha256: 82da8127b0620ec080d99b99f1954783389482add071a896c3251bb88a42c600
    licencia: "CC BY 3.0, © Blender Foundation (durian.blender.org)"
    enlace_licencia: https://creativecommons.org/licenses/by/3.0/
    recorte: {inicio: 39.6, duracion: 17.0}
    toma:
      numero: 3
      gancho: "Ella busca a un dragón"
      palabra_lapiz: "DRAGÓN"
      lapiz: círculo
      escena: "INT. CABAÑA DEL CHAMÁN — NOCHE"
      credito: "Con: Blender Foundation (CC BY 3.0)"
    lineas:
      - {t0: 0.8, t1: 5.2, nombre: "CHAMÁN", frase: "¿Qué te trae a la tierra de los guardianes?", original: "What brings you to the land of the gatekeepers?"}
      - {t0: 6.4, t1: 8.9, nombre: "SINTEL", frase: "Busco a alguien.", original: "I'm searching for someone."}
      - {t0: 9.4, t1: 13.6, nombre: "CHAMÁN", frase: "¿Alguien muy querido? ¿Un alma gemela?", original: "Someone very dear? A kindred spirit?"}
      - {t0: 14.8, t1: 16.4, nombre: "SINTEL", frase: "Un dragón.", original: "A dragon."}

