# Sistema visual [Guion] (sección 5B). La fábrica no lleva colores ni fuentes escritos a mano.
nombre: "Guion Vivo"
usuario: "guionvivo"
confirmado: true             # Kevin lo confirmó el 17 nov 2026 23:17 GT
direccion: guion
lienzo: pagina               # página de guion 1080x1920 (sólo tomas sin video; con video manda plantilla_video)
plantilla_video: pantalla_completa   # con video: el clip cubre todo el cuadro y la marca va en placas encima (decisión de Kevin, 19 nov 2026)
resolucion: [1080, 1920]
colores:
  papel: "#F2EDE3"
  tinta: "#151515"
  lapiz_rojo: "#D4261C"
voces:                          # color del texto del diálogo según quién habla (nombres de `colores`; sin colores nuevos)
  streamer: tinta               # la voz con más tiempo hablado (la de la facecam)
  otra: lapiz_rojo              # la otra voz
fuente:
  familia: "Courier Prime"     # licencia abierta SIL OFL 1.1, uso comercial permitido
  estilos: [regular, bold, italic, bolditalic]
  archivos:                     # los 4 TTF viven en el repo (marca/fuentes/, OFL.txt al lado)
    regular: marca/fuentes/CourierPrime-Regular.ttf
    bold: marca/fuentes/CourierPrime-Bold.ttf
    italic: marca/fuentes/CourierPrime-Italic.ttf
    bolditalic: marca/fuentes/CourierPrime-BoldItalic.ttf
toma:
  contador: 7                   # sube en 1 con cada clip publicado
movimiento:
  transiciones: ninguna         # sólo corte seco
  zoom_automatico: false
  entrada_texto: {duracion_s: 0.35, subida_px: 14}   # piezas sin video: cada capa de diálogo entra con fundido y una subida corta
sonido:
  musica_de_biblioteca: true    # decisión de Kevin del 19 nov 2026: sólo en piezas sin audio propio; manda sobre el false anterior
  sello_sonoro: opcional        # propio, de menos de 0.4 s
musica:                         # pistas CC0 del release privado `musica`; nunca en fichas con reglas.sin_musica
  manifiesto: marca/musica/pistas.yml
  solo_sin_audio_propio: true
  lufs: -16                     # sonoridad integrada objetivo
  pico_db: -1.5                 # pico verdadero máximo
  entrada_s: 0.4                # fundido de entrada
  salida_s: 0.8                 # fundido de salida
encabezado_max_palabras: 6
subtitulo_max_lineas: 2
mosca: {esquina: superior_derecha, texto: "GUION VIVO"}   # abajo la tapan los botones y el texto de las apps
maqueta:                        # todas las medidas de la página de guion, en píxeles sobre 1080x1920
  margen: 90                    # margen izquierdo y derecho de la página
  columna_dialogo: [120, 960]   # columna del diálogo, fuera de los botones laterales de las apps
  fila_superior_y: 178          # fila superior: TOMA nnn y mosca
  tam_fila: 34
  gancho_y: 238
  tam_gancho: 66
  alto_linea_gancho: 82
  espacio_tras_gancho: 22       # entre el gancho y la regla
  regla_grosor: 3
  espacio_tras_regla: 26
  tam_escena: 36
  alto_escena: 50
  espacio_tras_escena: 30
  tam_nombre: 42
  alto_nombre: 58
  tam_acotacion: 38
  alto_acotacion: 54
  tam_frase: 50
  alto_linea_frase: 64
  espacio_video_dialogo: 64     # entre el video y el diálogo
  margen_inferior: 320          # franja libre al pie del cuadro (botones y texto de las apps)
  alto_dialogo_sin_video: 260   # separación del diálogo bajo la línea de escena si no hay video
  tam_corte: 76
  corte_y: 820
  tam_credito: 42
  credito_y: 930
  cierre_s: 0.5                 # el cierre ocupa el último medio segundo
  opacidad_mosca: 0.80
  grano: {papel: 2.2, fibra: 1.2, bloque_fibra: 4, semilla: 7}
  circulo: {margen_x: 28, margen_y: 20, irregularidad: 0.06, sobrepaso_grados: [15, 35], grosor: [5, 8],
            giro_max_grados: 3, holguras_extra: [4, 8, 14], holgura_letra: 1.0}
  subrayado: {grosor: [6, 9], sobresale: [12, 24], bajo_palabra: 6, alto_extra: 14,
              inclinacion_max: 0.012, amplitud: [1.6, 3.2]}
marca_agua:                     # logo de una campaña (ficha.marca_agua): lugar fijo, nunca sobre la cabecera, el diálogo ni la mosca (en v2, ver pantalla_completa.agua)
  posicion: cuerpo_inferior_derecha   # esquina del cuerpo de video (cuerpo_inferior|superior_derecha|izquierda)
  ancho: 220                    # píxeles del logo sobre 1080 de ancho
  margen: 24                    # separación al borde del video
  opacidad: 0.95
  placa: 10                     # relleno de la placa de papel que da contraste al logo oscuro
pantalla_completa:              # plantilla v2 de las tomas con video: todas las medidas, en píxeles sobre 1080x1920
  zona_segura: {x0: 60, y0: 150, x1: 1020, y1: 1600}    # nada de marca fuera de aquí (arriba y abajo tapan las apps)
  zona_accion: {x0: 60, y0: 460, x1: 1020, y1: 1280}    # el centro del cuadro: ninguna placa lo toca
  tope_capas: 0.22              # área sumada máxima de las placas activas, como fracción del cuadro
  gancho_s: 3.0                 # segundos que se ven el gancho y la escena; luego sólo la fila mínima
  relleno_placa: 14             # aire entre el texto y el borde de la placa de papel
  ancho_max_encabezado: 700     # ancho máximo de las placas del encabezado (la mosca y el logo quedan al otro lado)
  recorte:                      # encuadre fijo por toma (sin zoom ni paneo)
    fotogramas: 12              # cuántos fotogramas se miran para seguir la acción
    ancho_analisis: 192         # ancho en píxeles de esos fotogramas en gris
    margen_accion: 0.05         # la ventana de acción debe superar a la centrada en esta fracción
    peso_bordes: 0.2            # peso de los bordes frente al movimiento
  fila: {tam_toma: 28, tam_credito: 24, separacion: 16}            # TOMA nnn y crédito, siempre en pantalla
  cabecera: {tam_gancho: 44, alto_linea_gancho: 54, tam_escena: 24, alto_escena: 32, espacio_escena: 8}
  mosca: {tam: 24, relleno: 12}
  dialogo:
    columna_dialogo: [120, 960]
    tam_nombre: 34
    alto_nombre: 44
    tam_acotacion: 30
    alto_acotacion: 40
    tam_frase: 38
    alto_linea_frase: 50
    relleno_x: 24
    relleno_y: 18
    borde_inferior: 1560        # el borde de abajo de la placa queda sobre la franja de las apps (1600 a 1920)
  cierre: {tam_corte: 56, alto_corte: 68, tam_credito: 26, alto_credito: 36, relleno_x: 28, relleno_y: 18, borde_inferior: 1560}
  agua: {y: 216}                # el logo de campaña va bajo la mosca, pegado al borde de la zona segura
  lapiz:                        # trazos del lápiz rojo a la escala del gancho compacto
    reserva: 24                 # aire a cada lado del gancho para que el trazo no se salga de la placa
    circulo: {margen_x: 14, margen_y: 9, irregularidad: 0.06, sobrepaso_grados: [15, 35], grosor: [3, 5],
              giro_max_grados: 3, holguras_extra: [3, 6, 10], holgura_letra: 1.0}
    subrayado: {grosor: [4, 6], sobresale: [8, 14], bajo_palabra: 4, alto_extra: 10,
                inclinacion_max: 0.012, amplitud: [1.0, 2.0]}
dividida:                       # tarea #16: pantalla dividida (facecam arriba, juego abajo); sin facecam manda pantalla_completa
  activa: true                  # interruptor global (por ficha: reglas.dividida: false)
  alto_facecam: 672             # alto del panel de arriba (35 %); el del juego es el resto del cuadro (1248)
  tolerancia_alto: 0.02         # la puerta acepta el alto del panel de la facecam con este margen relativo
  cara_centro_y: 0.48           # fracción del alto del panel donde va el centro de la cara
  holgura_cara: 0.10            # aire alrededor de la caja de Haar (frente y barbilla) para decir que la cara va entera
  max_cara_panel: 0.85          # la cara con holgura ocupa a lo sumo esta fracción del alto del panel
  max_escala_facecam: 4.0       # el recorte de la facecam no se amplía más que esto (más: facecam muy chica, pantalla completa)
  margen_cara: 24               # separación mínima entre la cara y cualquier placa, en píxeles del cuadro
  zona_accion: {x0: 60, y0: 960, x1: 1020, y1: 1300}   # dentro del panel del juego: ninguna placa lo toca
  placas_alterna: {y_fila: 690}  # posición de la fila (y de la cabecera tras ella) si la de siempre toca la cara
  deteccion:                    # sin red ni modelos descargados: Haar del paquete opencv-python-headless
    fotogramas: 24              # fotogramas en gris que se leen del recorte de tiempo
    fotogramas_cara: 24         # de esos, en cuántos se busca la cara (todos: con 12, ffmpeg 8 de CI dejaba la muestra a 1 fotograma del umbral)
    ancho_analisis: 640         # ancho en píxeles de esos fotogramas
    haar: {escala: 1.1, vecinos: 5, min_lado: 0.035}   # min_lado: fracción del ancho de análisis
    min_fraccion_cara: 0.5      # la cara debe verse en al menos esta fracción de los fotogramas mirados
    max_dispersion: 0.04        # distancia máxima de los centros de la cara a su mediana, como fracción del ancho
    max_area_cara: 0.06         # área máxima de la cara como fracción del cuadro
    centro_excluido: {x: [0.3, 0.7], y: [0.3, 0.7]}   # una cara con el centro aquí no es facecam
    expansion: {min: 0.05, max: 4.0, fija: 1.4, recorte_borde: 0.003}   # caja de la facecam, en anchos y altos de cara; el borde se deja fuera (fracción del ancho)
    borde_persistente: {umbral: 30, fraccion: 0.6}    # gradiente (0-255) que se mantiene y parte de la línea que debe cubrir
    umbral_borde: 40            # un píxel es borde si su gradiente pasa de esto
    rejilla: [24, 14]           # celdas (columnas, filas) para buscar estorbos
    banda: 0.25                 # los estorbos se buscan en esta fracción exterior del cuadro
    banda_chat: 0.2             # y el chat en esta fracción lateral
    densidad_logo: 0.08         # fracción de bordes de una celda fija para tomarla por logo o marco
    variacion_estatica: 0.04    # variación máxima en el tiempo de esa densidad
    densidad_chat: 0.10         # fracción de bordes de una celda lateral para tomarla por chat
    min_celdas_chat: 3          # celdas juntas que hacen un chat
    densidad_base_alerta: 0.03  # una alerta aparece sobre una celda tranquila (densidad de bordes mediana de esto o menos)
    salto_alerta: 0.12          # subida de densidad que delata una alerta
    min_celdas_alerta: 6        # celdas juntas que hacen una alerta
    max_fraccion_alerta: 0.3    # fracción máxima de los fotogramas con la alerta a la vista
    min_movimiento: 2.0         # movimiento medio del resto del cuadro; menos y no se marcan estorbos fijos
    peso_bordes: 0.2            # peso de los bordes frente al movimiento en la energía del juego
    min_alto_juego: 0.55        # alto mínimo del recorte del juego, como fracción de la fuente
    margen_facecam: 0.01        # separación entre el recorte del juego y la facecam, como fracción del ancho
    peso_estorbo: 3.0           # castigo por área tapada cuando no hay recorte que evite todos los estorbos
    plazo_min_s: 5              # segundos de plazo que deben quedar para empezar a detectar
    plazo_min_cara_s: 2         # y para buscar la cara en cada fotograma
    min_lado_px: 12             # lado mínimo (px de análisis) de una cara para Haar
    tamanos_juego: 8            # alturas de recorte probadas para la zona del juego
    paso_juego: 2               # paso (px de análisis) de la búsqueda de la zona del juego
    peso_centro: 0.05           # preferencia por un recorte centrado cuando hay empate
    peso_tamano: 0.1            # preferencia por el recorte más grande
avisos:                         # decisión de Kevin (22 nov 2026): spoiler, cinemática y mods no descartan; avisan al inicio del clip
  duracion_s: 1.2               # visible desde el cuadro 0 hasta este segundo (de 0,8 a 1,5); el gancho entra al salir el aviso
  textos:                       # mayúsculas, una línea; con varios avisos, una sola placa: «ALERTA SPOILER · CINEMÁTICA · MODS»
    spoiler: "ALERTA SPOILER"
    cinematica: "ALERTA CINEMÁTICA"
    mods: "ALERTA MODS"
prohibido:
  - subtítulos palabra por palabra con una palabra en amarillo
  - emojis dentro del video
  - voz generada por IA
  - imágenes o miniaturas generadas por IA
  - degradados neón morado y rosa
  - barras de progreso
  - stickers de stock
  - marcas de agua de herramientas
  - ganchos genéricos (NO VAS A CREER, ESTO CAMBIA TODO, EL FINAL TE SORPRENDERÁ)
  - tipografías de plantilla (sans gruesa con borde negro)
