# Cómo se mide: procedimientos/prueba-retencion.md. Informe: python -m fabrica.retencion --informe
activa: true
nombre: corta-10-14
inicio: 2026-11-22
brazos:
  corta: {duracion_s: [10, 14], gancho_max_s: 1.0}   # el recorte dura de 10 a 14 s y empieza a lo sumo 1 s antes del momento fuerte
