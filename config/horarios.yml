zona: America/Guatemala
# Decisión de Kevin (19 nov 2026, 8:00 p. m.): 6 clips al día por red, todos los días (también en estreno).
# Horas GT, ordenadas y sin repetir (8 como máximo). Cada corrida programa a lo sumo un hueco.
huecos: ["09:00", "11:00", "13:00", "16:00", "19:00", "22:00"]
# 18 nov 00:43: Kevin pidió que los clips salgan antes de las 11:00, siempre con las puertas en verde.
margen_min_minutos: 15      # el hueco debe caer de ahora+15 ...
margen_max_minutos: 75      # ... a ahora+75 min
relleno:                    # un hueco de hoy que se perdió se rellena sin amontonar
  separacion_min_minutos: 60
  ultima_hora: "23:00"
  max_intentos_por_hueco: 2
cola_buffer_max: 10         # plan gratis de Buffer: 10 programados por canal
no_repetir_horas: 24
actions:
  tope_minutos_dia: 300     # repo público desde el 20 nov 2026 (minutos sin tope): alcanza para 6 tomas al día; freno ante un bucle
# A-20261125-1 (Kevin, 25 nov: «2 Shorts»): Buffer gratis deja 2 Shorts por canal cada 24 h (ventana móvil).
# Pasado el cupo no se crea el post de Shorts. Criterio de «mejor» en fabrica/shorts.py.
shorts:
  max_24h: 2
  margen_minutos: 10            # holgura sobre las 24 h (Buffer publica con segundos de retraso)
  desde: "13:00"                # antes, sólo tomas de campaña
  campana_cualquier_hora: true
  max_consultas: 4              # estados de Buffer que se piden por toma para descontar los posts en error
